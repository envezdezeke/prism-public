# Fraud-model parameters (docs/MODEL_DESIGN.md section 1: M7, M8, M13, M18).
# This file stores percentiles and fractions, never bit values. Bit thresholds
# are recomputed at startup from whatever history ships with the dataset.
version: 1

families:
  F1:                      # shared rare entity (mandatory for a hold)
    votes: true
    rarity_fraction: 0.02  # entity counts only if fewer than 2% of history deals use it
    min_linked_deals: 2    # ... and it links at least this many deals
    # Pair-score weights per entity kind (weights, not bit thresholds). No percentile here:
    # F1 is mandatory for a hold and fires on any strong shared entity.
    type_weights:
      remit_account: 1.0     # account, preparer, agent: strong
      preparer: 1.0
      registered_agent: 1.0
      phone: 1.0             # a phone follows its preparer
      guarantor: 1.0         # one guarantor across businesses is a ring tell
      vendor: 0.5            # common tooling and vendors are shared by honest deals
      pdf_producer: 0.5
      address: 0.25          # address and bank: weak
      bank: 0.25
    outcome_beta: 0.5        # discount for shared values whose history deals repaid
  F2:                      # novelty or burst
    votes: true
    percentile: 0.95       # kept for the config contract; F2 is a structural rule and ignores it
    burst_window_days: 7   # partners sharing a strong entity, opened within this many days
    burst_min_partners: 1  # fires at this many burst partners; bits = log2(1 + k)
  F3:                      # lookalike vendor or account
    votes: true
    percentile: 0.95
    min_similarity: 0.8    # token-set similarity floor for "same base name"
    max_edit_distance: 2   # ... or a typo within this many edits
    min_vendor_deals: 3    # a "frequent" history vendor has at least this many deals
  F4:                      # document forensics
    votes: true
    percentile: 0.95       # kept for the config contract; F4 is a structural rule and ignores it
    third_party_classes: [bank_statement]   # documents that should come from someone else's tool
    borrower_classes: [application, request_letter, equipment_quote, financial_statements]
    min_docs: 3            # at least this many third-party docs made by a borrower-paperwork tool
    min_share: 0.8         # ... and at least this share of the usable ones (producer text, no OCR)
  F5:                      # deposit pattern
    votes: true
    percentile: 0.95
    dirichlet_alpha: 0.5   # weekday-distribution smoothing
  F6:                      # terms shape: evidence only, never votes
    votes: false
    tail_percentile: 0.95  # amount/revenue at or above this percentile of clean history

hold_rule:
  required: [F1]
  additional_from: [F2, F3, F4, F5]
  min_additional: 2
  strong_link_min_additional: 1   # F1 + 1 is enough when two independent link classes join the deal to a partner

history_flags:
  min_links: 2             # independent links with a held cluster (M18)
  # Optional: merge entity kinds that always travel together into one independent link
  # class, e.g.  link_classes: {preparer_office: [preparer, phone]}
  # Default (key absent): every entity kind is its own class and pdf_producer is the class
  # "producer"; the same lookalike-vendor group (F3) and the same strongest deposit
  # statistic (F5) are one class each.

calibration:               # measurement split only; real runs use all history as baseline
  train_end: "2026-06-30"
  test_start: "2026-07-01"
  test_end: "2026-10-31"
